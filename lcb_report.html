<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>รายงานเบอร์ตู้ — แหลมฉบัง</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
body{margin:0;background:#dfe5ec;color:#000;
     font-family:"Sarabun",-apple-system,"Segoe UI","Noto Sans Thai",sans-serif;
     -webkit-font-smoothing:antialiased}

/* ── กระดาษ A4 ────────────────────────────────────────── */
.sheet{width:210mm;min-height:297mm;margin:16px auto;background:#fff;
       padding:15mm 14mm 12mm;box-shadow:0 4px 18px rgba(15,23,42,.2)}

.tbox{border:2.5px solid #000;padding:10px 12px;text-align:center;margin-bottom:18px}
.tbox h1{margin:0;font-size:28px;font-weight:800;letter-spacing:.3px;line-height:1.25}

.l1{font-size:19px;margin:0 0 6px;font-weight:500}
.l1 b{font-size:26px;font-weight:800;letter-spacing:.2px}
.l2{font-size:17px;font-weight:600;margin:0 0 14px;color:#111}

table{width:100%;border-collapse:collapse;table-layout:fixed}
th,td{border:1.3px solid #000;padding:0 5px;text-align:center;height:9.2mm;
      font-size:15px;vertical-align:middle}
thead th{font-size:14px;font-weight:700;line-height:1.2;padding:5px 4px;height:auto;
         background:#f2f4f7}
.c-no   {width:7%}
.c-truck{width:20%;font-size:14px;font-weight:500}
.c-ctr  {width:22%;font-size:17px;font-weight:800;letter-spacing:.4px}
.c-seal {width:17%;font-weight:700;letter-spacing:.2px}
.c-date {width:19%;font-weight:500}
.c-wt   {width:15%;font-weight:600}
tbody tr:nth-child(even){background:#fafbfc}
td.seq{font-weight:600;color:#000}          /* ← ลำดับต้องเห็นทุกแถว รวมแถวว่าง */

.foot{margin-top:9px;display:flex;justify-content:space-between;
      font-size:11.5px;color:#555}

/* ── แถบเครื่องมือ (ไม่พิมพ์/ไม่เข้า PDF) ─────────────── */
.bar{position:sticky;top:0;z-index:9;background:#0f172a;color:#fff;padding:9px 12px;
     display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.bar select{padding:8px 10px;border-radius:8px;border:none;font-size:14px;
            font-family:inherit;max-width:52vw}
.bar button{padding:8px 15px;border-radius:8px;border:none;font-weight:700;
            font-size:14px;font-family:inherit;color:#fff;background:#10b981}
.bar button.alt{background:#334155}
.bar button:disabled{background:#64748b}
.bar .sp{margin-left:auto;font-size:12px;opacity:.8}
.mid{padding:60px 24px;text-align:center;color:#475569;line-height:1.7}
.err{color:#b91c1c;font-weight:700}

@media print{
  body{background:#fff}
  .bar{display:none}
  .sheet{width:auto;min-height:0;margin:0;padding:0;box-shadow:none}
  thead th{background:#f2f4f7 !important;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  tbody tr:nth-child(even){background:#fafbfc !important;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  @page{size:A4 portrait;margin:12mm}
}
@media(max-width:820px){
  .sheet{width:auto;padding:14px;margin:10px}
  .tbox h1{font-size:19px}
  .l1{font-size:15px}.l1 b{font-size:19px}.l2{font-size:13px}
  th,td{font-size:12px;height:8mm;padding:0 2px}
  thead th{font-size:11px}
  .c-ctr{font-size:13px}.c-truck{font-size:11px}.c-wt{font-size:11px}
}
</style>
</head>
<body>

<div class="bar">
  <select id="pick"><option>กำลังโหลด…</option></select>
  <button id="pdf">📄 บันทึก PDF</button>
  <button class="alt" onclick="window.print()">🖨 พิมพ์</button>
  <button class="alt" id="zip">🗂 รูป ZIP</button>
  <button class="alt" id="ipdf">🖼 รูป PDF</button>
  <span class="sp" id="meta"></span>
</div>

<div id="out"><div class="mid">กำลังโหลด…</div></div>

<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
<script>
const API = 'https://ywslgrusflfuxtrtvlfu.supabase.co/functions/v1/line-lcb';
const DOW = ['อาทิตย์','จันทร์','อังคาร','พุธ','พฤหัสบดี','ศุกร์','เสาร์'];
const MON = ['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];
let CUR = null;

const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

// 2026-07-11 → "เสาร์ 11 ก.ค."
function thaiDate(iso){
  if(!iso) return '';
  const d = new Date(iso + 'T00:00:00');
  if(isNaN(d)) return '';
  return `${DOW[d.getDay()]} ${d.getDate()} ${MON[d.getMonth()]}`;
}
function todayText(){
  const d = new Date();
  return `${d.getDate()} ${MON[d.getMonth()]} ${d.getFullYear() + 543}`;
}

function render(inv, list){
  CUR = inv;
  const total = Math.max(inv.container_count || 0, list.length);
  const rows = [];

  list.forEach((c, i) => rows.push(`<tr>
      <td class="seq">${i+1}</td>
      <td class="c-truck">${esc(c.truck_plate ?? '')}</td>
      <td class="c-ctr">${esc(c.container_no ?? '')}</td>
      <td class="c-seal">${esc(c.seal_no ?? '')}</td>
      <td class="c-date">${esc(thaiDate(c.factory_date))}</td>
      <td class="c-wt">${c.weight ? Number(c.weight).toLocaleString() : ''}</td>
    </tr>`));

  // แถวที่ยังไม่มีตู้ — ใส่เลขลำดับไว้ ช่องอื่นเว้นว่าง
  for(let i = list.length; i < total; i++){
    rows.push(`<tr><td class="seq">${i+1}</td><td></td><td></td><td></td><td></td><td></td></tr>`);
  }

  const line2 = [
    total ? `${total} ตู้` : '',
    inv.destination ? `ไป ${inv.destination}` : '',
    inv.customer ? `ของ ${inv.customer}` : '',
  ].filter(Boolean).join(' ');

  document.getElementById('out').innerHTML = `
  <div class="sheet" id="sheet">
    <div class="tbox"><h1>ท่าเรือสุราษฎร์ธานี - แหลมฉบัง</h1></div>
    <p class="l1">ขอแจ้งเบอร์ตู้ ของ <b>${esc(inv.invoice_no)}</b></p>
    <p class="l2">${esc(line2)}</p>
    <table>
      <thead><tr>
        <th class="c-no">ลำดับ</th>
        <th class="c-truck">ทะเบียนรถ</th>
        <th class="c-ctr">เบอร์ตู้</th>
        <th class="c-seal">SEAL NO.</th>
        <th class="c-date">วันที่เข้าโรงงาน</th>
        <th class="c-wt">น้ำหนัก (กก.)</th>
      </tr></thead>
      <tbody>${rows.join('')}</tbody>
    </table>
    <div class="foot">
      <span>กรอกแล้ว ${list.length} / ${total} ตู้</span>
      <span>พิมพ์เมื่อ ${todayText()}</span>
    </div>
  </div>`;

  document.getElementById('meta').textContent = `กรอกแล้ว ${list.length} / ${total} ตู้`;
  document.title = `เบอร์ตู้ ${inv.invoice_no}`;
}

// ── บันทึกเป็น PDF (A4 แนวตั้ง แบ่งหน้าอัตโนมัติถ้ายาวเกิน) ──
function say(msg){ document.getElementById('meta').textContent = msg; }

async function savePdf(){
  const btn = document.getElementById('pdf');
  const sheet = document.getElementById('sheet');
  if(!sheet){ say('ยังไม่มีรายงานให้บันทึก'); return; }

  if(typeof html2canvas !== 'function' || !window.jspdf){
    say('⚠️ โหลดตัวสร้าง PDF ไม่ได้ — ใช้ปุ่ม 🖨 พิมพ์ แทน');
    return;
  }

  btn.disabled = true; btn.textContent = 'กำลังสร้าง…';
  try{
    say('กำลังเตรียมฟอนต์…');
    if(document.fonts && document.fonts.ready){
      await Promise.race([document.fonts.ready, new Promise(r => setTimeout(r, 3000))]);
    }

    say('กำลังวาดหน้ากระดาษ…');
    const canvas = await html2canvas(sheet, {
      scale: Math.min(3, Math.max(2, 1600 / sheet.offsetWidth)),
      backgroundColor: '#ffffff', useCORS: true, logging: false,
    });

    say('กำลังประกอบ PDF…');
    const { jsPDF } = window.jspdf;
    const pdf = new jsPDF({ unit:'mm', format:'a4', orientation:'portrait' });
    const pw = pdf.internal.pageSize.getWidth();
    const ph = pdf.internal.pageSize.getHeight();
    const imgH = canvas.height * pw / canvas.width;   // ความสูงถ้าเต็มความกว้าง A4

    const img = canvas.toDataURL('image/jpeg', 0.94);
    if(imgH <= ph + 1){
      pdf.addImage(img, 'JPEG', 0, 0, pw, imgH);
    }else{
      let left = imgH, y = 0;
      while(left > 0){
        pdf.addImage(img, 'JPEG', 0, y, pw, imgH);
        left -= ph; y -= ph;
        if(left > 0) pdf.addPage();
      }
    }

    const name = (`เบอร์ตู้ ${CUR?.invoice_no || ''}`).replace(/[\\/:*?"<>|]/g, '-').trim() + '.pdf';
    const blob = pdf.output('blob');
    const url = URL.createObjectURL(blob);

    // ① ลองดาวน์โหลดตรงๆ (ได้ผลบนคอม)
    try{
      const a = document.createElement('a');
      a.href = url; a.download = name;
      document.body.appendChild(a); a.click(); a.remove();
    }catch(_){ /* เบราว์เซอร์ในแอปบางตัวไม่ยอม — ไปใช้ทางที่ ② */ }

    // ② โชว์ปุ่มเปิดไฟล์ค้างไว้ — เบราว์เซอร์ในไลน์มักบล็อกดาวน์โหลดเงียบๆ
    //    เปิดแล้วกดแชร์/เซฟจากหน้าอ่าน PDF ได้
    let open = document.getElementById('openpdf');
    if(!open){
      open = document.createElement('a');
      open.id = 'openpdf';
      open.target = '_blank'; open.rel = 'noopener';
      open.style.cssText = 'padding:8px 15px;border-radius:8px;background:#f59e0b;' +
                           'color:#fff;font-weight:700;font-size:14px;text-decoration:none';
      btn.parentNode.insertBefore(open, btn.nextSibling);
    }
    open.href = url;
    open.textContent = '↗ เปิด PDF';

    btn.textContent = '📄 บันทึก PDF';
    btn.disabled = false;
    say('สร้างเสร็จแล้ว — ถ้าไฟล์ไม่เด้ง กด "↗ เปิด PDF"');
  }catch(e){
    btn.textContent = '📄 บันทึก PDF'; btn.disabled = false;
    say('⚠️ สร้าง PDF ไม่สำเร็จ: ' + (e && e.message ? e.message : e));
  }
}

/* ══ โหลดรูปทั้งอินวอยซ์ — ZIP (ต้นฉบับ) / PDF (เปิดดูรวดเดียว) ══ */
async function fetchPhotos(){
  const inv = CUR?.invoice_no;
  if(!inv) throw new Error('ยังไม่ได้เลือกอินวอยซ์');
  const r = await fetch(`${API}/photos?inv=${encodeURIComponent(inv)}`);
  const j = await r.json();
  if(!r.ok) throw new Error(j.error || ('HTTP '+r.status));
  if(!j.files.length) throw new Error('อินวอยซ์นี้ยังไม่มีรูปที่เก็บไว้');
  return j.files;
}

function dl(blob, name){
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  /* เบราว์เซอร์ในไลน์บล็อกดาวน์โหลดเงียบๆ — โชว์ปุ่มเปิดไว้ให้ด้วย */
  let o = document.getElementById('openfile');
  if(!o){
    o = document.createElement('a'); o.id='openfile';
    o.target='_blank'; o.rel='noopener';
    o.style.cssText='padding:8px 15px;border-radius:8px;background:#f59e0b;color:#fff;font-weight:700;font-size:14px;text-decoration:none';
    document.getElementById('ipdf').parentNode.appendChild(o);
  }
  o.href = url; o.textContent = '↗ เปิดไฟล์';
}

async function dlZip(){
  const b = document.getElementById('zip');
  b.disabled = true; b.textContent = 'กำลังรวม…';
  try{
    if(!window.JSZip) throw new Error('โหลดตัวรวมไฟล์ไม่ได้');
    const files = await fetchPhotos();
    const zip = new JSZip();
    for(let i=0;i<files.length;i++){
      say(`กำลังดึงรูป ${i+1}/${files.length}…`);
      const blob = await (await fetch(files[i].url)).blob();
      zip.file(files[i].name, blob);
    }
    say('กำลังบีบอัด…');
    dl(await zip.generateAsync({type:'blob'}),
       `รูปตู้ ${(CUR.invoice_no||'').replace(/[\\/:*?"<>|]/g,'-')}.zip`);
    say(`รวม ${files.length} รูปเสร็จแล้ว`);
  }catch(e){ say('⚠️ ' + e.message); }
  b.disabled = false; b.textContent = '🗂 รูป ZIP';
}

async function dlImgPdf(){
  const b = document.getElementById('ipdf');
  b.disabled = true; b.textContent = 'กำลังรวม…';
  try{
    if(!window.jspdf) throw new Error('โหลดตัวสร้าง PDF ไม่ได้');
    const files = await fetchPhotos();
    const { jsPDF } = window.jspdf;
    const pdf = new jsPDF({unit:'mm', format:'a4', orientation:'portrait'});
    const pw = pdf.internal.pageSize.getWidth(), ph = pdf.internal.pageSize.getHeight();
    const M = 8;

    for(let i=0;i<files.length;i++){
      say(`กำลังใส่รูป ${i+1}/${files.length}…`);
      const f = files[i];
      const blob = await (await fetch(f.url)).blob();
      const data = await new Promise((res,rej)=>{
        const fr = new FileReader(); fr.onload=()=>res(fr.result); fr.onerror=rej;
        fr.readAsDataURL(blob);
      });
      const img = await new Promise((res,rej)=>{
        const im = new Image(); im.onload=()=>res(im); im.onerror=rej; im.src=data;
      });
      if(i) pdf.addPage();
      /* หัวกระดาษบอกว่ารูปนี้ของตู้ไหน */
      pdf.setFontSize(9);
      pdf.text(`${f.container_no}  ·  ${f.kind==='eir'?'EIR':'CONTAINER'}${f.seal_no?'  ·  SEAL '+f.seal_no:''}`, M, M+3);
      const availW = pw-M*2, availH = ph-M*2-6;
      const s = Math.min(availW/img.width, availH/img.height);
      pdf.addImage(data, 'JPEG', (pw-img.width*s)/2, M+6, img.width*s, img.height*s);
    }
    dl(pdf.output('blob'),
       `รูปตู้ ${(CUR.invoice_no||'').replace(/[\\/:*?"<>|]/g,'-')}.pdf`);
    say(`รวม ${files.length} รูปเสร็จแล้ว`);
  }catch(e){ say('⚠️ ' + e.message); }
  b.disabled = false; b.textContent = '🖼 รูป PDF';
}

async function load(inv){
  // ลบลิงก์ PDF ของอินวอยซ์ก่อนหน้า กันกดแล้วได้ไฟล์ผิดใบ
  const old = document.getElementById('openpdf');
  if(old){ try{ URL.revokeObjectURL(old.href); }catch(_){} old.remove(); }
  document.getElementById('out').innerHTML = '<div class="mid">กำลังโหลด…</div>';
  try{
    const r = await fetch(`${API}/report?inv=${encodeURIComponent(inv)}`);
    const j = await r.json();
    if(!r.ok) throw new Error(j.error || ('HTTP ' + r.status));
    render(j.invoice, j.containers || []);
    history.replaceState(null, '', '?inv=' + encodeURIComponent(inv));
  }catch(e){
    document.getElementById('out').innerHTML =
      `<div class="mid"><p class="err">${esc(e.message)}</p></div>`;
  }
}

(async function(){
  document.getElementById('pdf').onclick  = savePdf;
  document.getElementById('zip').onclick  = dlZip;
  document.getElementById('ipdf').onclick = dlImgPdf;
  let cur = new URLSearchParams(location.search).get('inv');
  const sel = document.getElementById('pick');
  try{
    const r = await fetch(`${API}/report`);
    const list = (await r.json()).invoices || [];
    if(!list.length){
      sel.innerHTML = '<option>ยังไม่มีอินวอยซ์</option>';
      document.getElementById('out').innerHTML = '<div class="mid">ยังไม่มีอินวอยซ์ในระบบ</div>';
      return;
    }
    sel.innerHTML = list.map(i =>
      `<option value="${esc(i.invoice_no)}">${esc(i.invoice_no)}</option>`).join('');
    if(!cur || !list.some(i => i.invoice_no === cur)) cur = list[0].invoice_no;
    sel.value = cur;
    sel.onchange = () => load(sel.value);
    load(cur);
  }catch(e){
    document.getElementById('out').innerHTML =
      `<div class="mid"><p class="err">โหลดรายชื่ออินวอยซ์ไม่ได้: ${esc(e.message)}</p></div>`;
  }
})();
</script>
</body>
</html>
