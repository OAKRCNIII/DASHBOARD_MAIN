<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ใบแจ้งเบอร์ตู้</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
body{margin:0;background:#dfe5ec;color:#000;
     font-family:"Sarabun",-apple-system,"Segoe UI","Noto Sans Thai",sans-serif;
     -webkit-font-smoothing:antialiased}

/* ── กระดาษ A4 ────────────────────────────────────────── */
.sheet{width:210mm;min-height:297mm;margin:16px auto;background:#fff;
       padding:15mm 14mm 12mm;box-shadow:0 4px 18px rgba(15,23,42,.2)}

.tbox{border:2.5px solid #000;padding:10px 12px;text-align:center;margin-bottom:18px}
.tbox h1{margin:0;font-size:28px;font-weight:800;letter-spacing:.3px;line-height:1.25}

.l1{font-size:19px;margin:0 0 6px;font-weight:500}
.l1 b{font-size:26px;font-weight:800;letter-spacing:.2px}
.l2{font-size:17px;font-weight:600;margin:0 0 14px;color:#111}

table{width:100%;border-collapse:collapse;table-layout:fixed}
th,td{border:1.3px solid #000;padding:0 5px;text-align:center;height:9.2mm;
      font-size:15px;vertical-align:middle}
thead th{font-size:14px;font-weight:700;line-height:1.2;padding:5px 4px;height:auto;
         background:#f2f4f7}
.c-no   {width:7%}
.c-truck{width:20%;font-size:14px;font-weight:500}
.c-ctr  {width:22%;font-size:17px;font-weight:800;letter-spacing:.4px}
.c-seal {width:17%;font-weight:700;letter-spacing:.2px}
.c-date {width:19%;font-weight:500}
.c-wt   {width:15%;font-weight:600}
.c-fac  {width:19%;font-weight:500}
tbody tr:nth-child(even){background:#fafbfc}
td.seq{font-weight:600;color:#000}          /* ← ลำดับต้องเห็นทุกแถว รวมแถวว่าง */

.foot{margin-top:9px;display:flex;justify-content:space-between;
      font-size:11.5px;color:#555}

/* ── แถบเครื่องมือ (ไม่พิมพ์/ไม่เข้า PDF) ─────────────── */
.bar{position:sticky;top:0;z-index:9;background:#0f172a;color:#fff;padding:9px 12px;
     display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.bar select{padding:8px 10px;border-radius:8px;border:none;font-size:14px;
            font-family:inherit;max-width:52vw}
.bar button{padding:8px 15px;border-radius:8px;border:none;font-weight:700;
            font-size:14px;font-family:inherit;color:#fff;background:#10b981}
.bar button.alt{background:#334155}
.bar button:disabled{background:#64748b}
.bar .sp{margin-left:auto;font-size:12px;opacity:.8}
.mid{padding:60px 24px;text-align:center;color:#475569;line-height:1.7}
.err{color:#b91c1c;font-weight:700}

@media print{
  body{background:#fff}
  .bar{display:none}
  .sheet{width:auto;min-height:0;margin:0;padding:0;box-shadow:none}
  thead th{background:#f2f4f7 !important;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  tbody tr:nth-child(even){background:#fafbfc !important;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  @page{size:A4 portrait;margin:12mm}
}
/* ย่อขนาดเฉพาะตอน "ดูบนจอ" — ไม่เอาตอนแคปเป็นรูป/PDF
   html2canvas วาดจากสภาพที่เห็นบนจอจริง ถ้าปล่อยให้ย่อ ตัวหนังสือจะล้น
   ช่องจนทับกัน (เบอร์ตู้ทับเลขซีล) เลยกันด้วย html:not(.shooting) */
@media(max-width:820px){
  html:not(.shooting) .sheet{width:auto;padding:14px;margin:10px}
  html:not(.shooting) .tbox h1{font-size:19px}
  html:not(.shooting) .l1{font-size:15px}
  html:not(.shooting) .l1 b{font-size:19px}
  html:not(.shooting) .l2{font-size:13px}
  html:not(.shooting) th,html:not(.shooting) td{font-size:12px;height:8mm;padding:0 2px}
  html:not(.shooting) thead th{font-size:11px}
  html:not(.shooting) .c-ctr{font-size:13px}
  html:not(.shooting) .c-truck{font-size:11px}
  html:not(.shooting) .c-wt{font-size:11px}
  html:not(.shooting) .c-fac{font-size:11px}
}
/* ตอนแคป บังคับความกว้างกระดาษเต็มเสมอ ไม่ว่าจอจะแคบแค่ไหน */
html.shooting .sheet{width:210mm !important;margin:0 !important;
  padding:15mm 14mm 12mm !important;box-shadow:none !important}
html.shooting body{width:210mm}
</style>
</head>
<body>

<div class="bar">
  <select id="pick"><option>กำลังโหลด…</option></select>
  <button id="png">🖼 บันทึกเป็นรูป</button>
  <button class="alt" id="pdf">📄 PDF</button>
  <button class="alt" onclick="window.print()">🖨 พิมพ์</button>
  <button class="alt" id="xls">📊 Excel</button>
  <span class="sp" id="meta"></span>
</div>

<div id="out"><div class="mid">กำลังโหลด…</div></div>

<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
<script>
const API = 'https://ywslgrusflfuxtrtvlfu.supabase.co/functions/v1/line-lcb';
const DOW = ['อาทิตย์','จันทร์','อังคาร','พุธ','พฤหัสบดี','ศุกร์','เสาร์'];
const MON = ['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];
let CUR = null, ROWS = [], KIND = 'LCB';

const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

// 2026-07-11 → "เสาร์ 11 ก.ค."
function thaiDate(iso){
  if(!iso) return '';
  const d = new Date(iso + 'T00:00:00');
  if(isNaN(d)) return '';
  return `${DOW[d.getDay()]} ${d.getDate()} ${MON[d.getMonth()]}`;
}
function todayText(){
  const d = new Date();
  return `${d.getDate()} ${MON[d.getMonth()]} ${d.getFullYear() + 543}`;
}

function render(inv, list, kind, locked){
  CUR = inv; ROWS = list; KIND = kind || 'LCB';
  const isLocked = !!(locked && locked.containers && locked.containers.length);
  const rows = [];

  /* คอลัมน์ต่างกันตามท่าเรือ — ปาดังไม่มีซีล แต่มีโรงงาน */
  const COLS = KIND === 'LCB'
    ? [['ลำดับ','c-no'],['ทะเบียนรถ','c-truck'],['เบอร์ตู้','c-ctr'],
       ['SEAL NO.','c-seal'],['วันที่เข้าโรงงาน','c-date'],['น้ำหนัก (กก.)','c-wt']]
    : [['ลำดับ','c-no'],['ทะเบียนรถ','c-truck'],['เบอร์ตู้','c-ctr'],
       ['วันที่เข้าโรงงาน','c-date'],['โรงงาน','c-fac'],['น้ำหนัก (กก.)','c-wt']];

  const cellsOf = c => KIND === 'LCB'
    ? [esc(c.truck_plate ?? ''), esc(c.container_no ?? ''), esc(c.seal_no ?? ''),
       esc(thaiDate(c.factory_date)), c.weight ? Number(c.weight).toLocaleString() : '']
    : [esc(c.truck_plate ?? ''), esc(c.container_no ?? ''),
       esc(thaiDate(c.factory_date)), esc(c.factory ?? ''),
       c.weight ? Number(c.weight).toLocaleString() : ''];

  let total, filled;
  if(isLocked){
    /* โหมดล็อคตู้: โชว์ตู้ล็อคครบตามลำดับที่ล็อคไว้ (id) + เติมรายละเอียดเฉพาะตู้ที่เข้าแล้ว */
    const _cn = v => String(v ?? '').trim().toUpperCase();
    const entMap = {};
    list.forEach(c => { if(c.container_no) entMap[_cn(c.container_no)] = c; });
    total = locked.containers.length; filled = 0;
    locked.containers.forEach((b, i) => {
      const e = entMap[_cn(b.container_no)];
      if(e) filled++;
      const c = e || { container_no: b.container_no };   // ยังไม่เข้า → มีแค่เบอร์ตู้
      const tds = cellsOf(c).map((v, j) => `<td class="${COLS[j+1][1]}">${v}</td>`).join('');
      rows.push(`<tr${e ? '' : ' class="wait"'}><td class="seq">${i+1}</td>${tds}</tr>`);
    });
  } else {
    /* โหมดปกติ: เติมทีละตู้ตอนเข้าโรงงาน + แถวว่างรอ */
    total = Math.max(inv.container_count || 0, list.length); filled = list.length;
    list.forEach((c, i) => {
      const tds = cellsOf(c).map((v, j) => `<td class="${COLS[j+1][1]}">${v}</td>`).join('');
      rows.push(`<tr><td class="seq">${i+1}</td>${tds}</tr>`);
    });
    const blanks = COLS.slice(1).map(() => '<td></td>').join('');
    for(let i = list.length; i < total; i++){
      rows.push(`<tr><td class="seq">${i+1}</td>${blanks}</tr>`);
    }
  }

  const line2 = [
    total ? `${total} ตู้` : '',
    inv.destination ? `ไป ${inv.destination}` : '',
    inv.customer ? `ของ ${inv.customer}` : '',
  ].filter(Boolean).join(' ');

  document.getElementById('out').innerHTML = `
  <div class="sheet" id="sheet">
    <div class="tbox"><h1>${KIND === 'LCB' ? 'ท่าเรือสุราษฎร์ธานี - แหลมฉบัง' : 'ใบแจ้งเบอร์ตู้'}</h1></div>
    <p class="l1">ขอแจ้งเบอร์ตู้ ของ <b>${esc(inv.invoice_no)}</b></p>
    <p class="l2">${esc(line2)}</p>
    <table>
      <thead><tr>${COLS.map(([t,cl])=>`<th class="${cl}">${t}</th>`).join('')}</tr></thead>
      <tbody>${rows.join('')}</tbody>
    </table>
    <div class="foot">
      <span>${isLocked ? '🔒 ล็อคตู้ · เข้าแล้ว' : 'กรอกแล้ว'} ${filled} / ${total} ตู้</span>
      <span>พิมพ์เมื่อ ${todayText()}</span>
    </div>
  </div>`;

  document.getElementById('meta').textContent = `${isLocked ? '🔒 ' : ''}${isLocked ? 'เข้าแล้ว' : 'กรอกแล้ว'} ${filled} / ${total} ตู้`;
  document.title = `เบอร์ตู้ ${inv.invoice_no}`;
}

function say(msg){ document.getElementById('meta').textContent = msg; }

/* วาดหน้ากระดาษเป็น canvas — ใช้ร่วมกันทั้งปุ่มรูปและปุ่ม PDF */
async function sheetCanvas(){
  const sheet = document.getElementById('sheet');
  if(!sheet) throw new Error('ยังไม่มีรายงานให้บันทึก');
  if(typeof html2canvas !== 'function') throw new Error('โหลดตัวสร้างรูปไม่ได้ — ใช้ปุ่ม 🖨 พิมพ์ แทน');
  say('กำลังเตรียมฟอนต์…');
  if(document.fonts && document.fonts.ready){
    await Promise.race([document.fonts.ready, new Promise(r => setTimeout(r, 3000))]);
  }
  say('กำลังวาดหน้ากระดาษ…');
  /* บังคับให้หน้ากระดาษกลับไปกว้างเต็ม A4 ก่อนแคป
     ไม่งั้นบนมือถือจะได้รูปที่ตัวหนังสือล้นช่องทับกัน */
  document.documentElement.classList.add('shooting');
  try{
    /* รอให้เบราว์เซอร์คำนวณหน้าใหม่ก่อนแคป
       ใช้ setTimeout ไม่ใช่ requestAnimationFrame เพราะ rAF ไม่ทำงาน
       ตอนหน้าเว็บถูกซ่อน/สลับแอป — เบราว์เซอร์ในไลน์เจอบ่อย แล้วจะค้างยาว */
    sheet.offsetHeight;                       /* บังคับคำนวณ layout ใหม่ */
    await new Promise(r => setTimeout(r, 60));
    const w = sheet.offsetWidth, hgt = sheet.offsetHeight;
    return await html2canvas(sheet, {
      scale: Math.min(3, Math.max(2, 1600 / w)),
      backgroundColor: '#ffffff', useCORS: true, logging: false,
      width: w, height: hgt, windowWidth: w, windowHeight: hgt,
      scrollX: 0, scrollY: 0,
    });
  } finally {
    document.documentElement.classList.remove('shooting');
  }
}

function fileName(ext){
  return `เบอร์ตู้ ${(CUR?.invoice_no || '')}`.replace(/[\\/:*?"<>|]/g,'-').trim() + ext;
}

/* ปุ่มสำรอง — เบราว์เซอร์ในไลน์บล็อกดาวน์โหลดเงียบๆ กดเปิดแล้วกดค้างเซฟลงคลังรูปได้ */
function showOpen(url, label){
  let o = document.getElementById('openfile');
  if(!o){
    o = document.createElement('a'); o.id = 'openfile';
    o.target = '_blank'; o.rel = 'noopener';
    o.style.cssText = 'padding:8px 15px;border-radius:8px;background:#f59e0b;color:#fff;'
                    + 'font-weight:700;font-size:14px;text-decoration:none';
    document.getElementById('pdf').parentNode.insertBefore(o, document.getElementById('meta'));
  }
  o.href = url; o.textContent = label;
}

// ── บันทึกเป็นรูป ──────────────────────────────────────────
//  เบราว์เซอร์ในไลน์บล็อกการดาวน์โหลดทุกแบบ (blob/data ก็ไม่ผ่าน)
//  แต่ "กดค้างที่รูปเพื่อบันทึก" ยังใช้ได้ตามปกติ
//  → เอารูปมาแปะเต็มจอให้กดค้างเอา ส่วนบนคอมก็ยังดาวน์โหลดตรงได้
function closeShot(){
  const o = document.getElementById('shotBg');
  if(o) o.style.display = 'none';
}

function showShot(dataUrl){
  let bg = document.getElementById('shotBg');
  if(!bg){
    bg = document.createElement('div');
    bg.id = 'shotBg';
    bg.style.cssText = 'position:fixed;inset:0;background:rgba(15,23,42,.92);z-index:9999;'
                     + 'display:none;flex-direction:column;';
    bg.innerHTML = `
      <div style="padding:12px 14px;color:#fff;display:flex;align-items:center;gap:10px;flex-shrink:0;">
        <div style="font-size:13px;font-weight:800;line-height:1.4;">
          👇 กดค้างที่รูป แล้วเลือก "บันทึกรูปภาพ"
          <div style="font-size:11px;font-weight:400;opacity:.75;margin-top:2px;">
            เลื่อนดูได้ · รูปเต็มความละเอียด
          </div>
        </div>
        <button onclick="closeShot()" style="margin-left:auto;background:#334155;color:#fff;border:none;
          border-radius:8px;padding:8px 14px;font-size:13px;font-weight:700;font-family:inherit;">ปิด</button>
      </div>
      <div style="flex:1;overflow:auto;padding:0 10px 16px;">
        <img id="shotImg" style="width:100%;display:block;border-radius:6px;background:#fff;">
      </div>`;
    document.body.appendChild(bg);
  }
  document.getElementById('shotImg').src = dataUrl;
  bg.style.display = 'flex';
}

async function savePng(){
  const btn = document.getElementById('png');
  btn.disabled = true; btn.textContent = 'กำลังสร้าง…';
  try{
    const canvas = await sheetCanvas();
    say('กำลังบันทึกรูป…');
    const dataUrl = canvas.toDataURL('image/png');

    // บนคอม/เบราว์เซอร์ปกติ — ดาวน์โหลดได้เลย
    try{
      const a = document.createElement('a');
      a.href = dataUrl; a.download = fileName('.png');
      document.body.appendChild(a); a.click(); a.remove();
    }catch(_){}

    // ในไลน์ดาวน์โหลดไม่ผ่าน — เปิดรูปให้กดค้างเซฟแทน
    showShot(dataUrl);
    say('ถ้าไฟล์ไม่เด้ง ให้กดค้างที่รูปเพื่อบันทึก');
  }catch(e){
    say('⚠️ ' + (e && e.message ? e.message : e));
  }
  btn.disabled = false; btn.textContent = '🖼 บันทึกเป็นรูป';
}

// ── บันทึกเป็น PDF (A4 แนวตั้ง แบ่งหน้าอัตโนมัติถ้ายาวเกิน) ──

async function savePdf(){
  const btn = document.getElementById('pdf');
  btn.disabled = true; btn.textContent = 'กำลังสร้าง…';
  try{
    if(!window.jspdf) throw new Error('โหลดตัวสร้าง PDF ไม่ได้ — ใช้ปุ่ม 🖨 พิมพ์ แทน');
    const canvas = await sheetCanvas();

    say('กำลังประกอบ PDF…');
    const { jsPDF } = window.jspdf;
    const pdf = new jsPDF({ unit:'mm', format:'a4', orientation:'portrait' });
    const pw = pdf.internal.pageSize.getWidth();
    const ph = pdf.internal.pageSize.getHeight();
    const imgH = canvas.height * pw / canvas.width;
    const img = canvas.toDataURL('image/jpeg', 0.94);

    if(imgH <= ph + 1){
      pdf.addImage(img, 'JPEG', 0, 0, pw, imgH);
    }else{
      let left = imgH, y = 0;
      while(left > 0){
        pdf.addImage(img, 'JPEG', 0, y, pw, imgH);
        left -= ph; y -= ph;
        if(left > 0) pdf.addPage();
      }
    }

    const url = URL.createObjectURL(pdf.output('blob'));
    try{
      const a = document.createElement('a');
      a.href = url; a.download = fileName('.pdf');
      document.body.appendChild(a); a.click(); a.remove();
    }catch(_){}
    showOpen(url, '↗ เปิด PDF');
    say('เสร็จแล้ว — ถ้าไฟล์ไม่เด้ง กด "↗ เปิด PDF"');
  }catch(e){
    say('⚠️ ' + (e && e.message ? e.message : e));
  }
  btn.disabled = false; btn.textContent = '📄 PDF';
}

/* ══ ออกเป็น Excel — โหลดไลบรารีตอนกดปุ่มเท่านั้น ══ */
function lazyScript(src){
  return new Promise((res,rej)=>{
    if([...document.scripts].some(s=>s.src===src)) return res();
    const s=document.createElement('script');
    s.src=src; s.onload=()=>res(); s.onerror=()=>rej(new Error('โหลดตัวสร้าง Excel ไม่ได้'));
    document.head.appendChild(s);
  });
}

/* Tahoma — มีในทุกเครื่อง Windows และแสดงไทยได้ครบ
   (Sarabun สวยกว่าแต่เครื่องปลายทางอาจไม่มี ไฟล์จะเพี้ยน) */
const XF = 'Tahoma';
const line  = { style:'thin',  color:{rgb:'000000'} };
const thick = { style:'medium',color:{rgb:'000000'} };
const boxAll   = { top:line,  bottom:line,  left:line,  right:line  };
const boxThick = { top:thick, bottom:thick, left:thick, right:thick };
const mid = { horizontal:'center', vertical:'center', wrapText:false };

async function saveXlsx(){
  const btn = document.getElementById('xls');
  if(!CUR){ say('ยังไม่ได้เลือกอินวอยซ์'); return; }
  btn.disabled = true; btn.textContent = 'กำลังสร้าง…';
  try{
    say('กำลังเตรียม…');
    /* xlsx-js-style = SheetJS ที่รองรับสไตล์ (ตัวปกติใส่เส้นขอบ/สีไม่ได้) */
    await lazyScript('https://cdn.jsdelivr.net/npm/xlsx-js-style@1.2.0/dist/xlsx.bundle.js');

    const total = Math.max(CUR.container_count || 0, ROWS.length);
    const line2 = [
      total ? `${total} ตู้` : '',
      CUR.destination ? `ไป ${CUR.destination}` : '',
      CUR.customer ? `ของ ${CUR.customer}` : '',
    ].filter(Boolean).join(' ');

    const HEAD = KIND === 'LCB'
      ? ['ลำดับ','ทะเบียนรถ','เบอร์ตู้','SEAL NO.','วันที่เข้าโรงงาน','น้ำหนัก (กก.)']
      : ['ลำดับ','ทะเบียนรถ','เบอร์ตู้','วันที่เข้าโรงงาน','โรงงาน','น้ำหนัก (กก.)'];
    const aoa = [
      [KIND === 'LCB' ? 'ท่าเรือสุราษฎร์ธานี - แหลมฉบัง' : 'ใบแจ้งเบอร์ตู้'],
      [],
      [`ขอแจ้งเบอร์ตู้ ของ ${CUR.invoice_no}`],
      [line2],
      [],
      HEAD,
    ];
    ROWS.forEach((c,i)=>aoa.push(KIND === 'LCB'
      ? [i+1, c.truck_plate ?? '', c.container_no ?? '', c.seal_no ?? '',
         thaiDate(c.factory_date), c.weight ? Number(c.weight) : '']
      : [i+1, c.truck_plate ?? '', c.container_no ?? '',
         thaiDate(c.factory_date), c.factory ?? '', c.weight ? Number(c.weight) : '']));
    for(let i=ROWS.length;i<total;i++) aoa.push([i+1,'','','','','']);
    const R_FOOT = aoa.length + 1;
    aoa.push([], [`กรอกแล้ว ${ROWS.length} / ${total} ตู้`, '', '', '', '', `พิมพ์เมื่อ ${todayText()}`]);

    const XLSX = window.XLSX;
    const ws = XLSX.utils.aoa_to_sheet(aoa);
    const R_HEAD = 5, R_FIRST = 6, R_LAST = 5 + total;

    const put = (r,c,st)=>{
      const a = XLSX.utils.encode_cell({r,c});
      if(!ws[a]) ws[a] = { t:'s', v:'' };      /* เซลล์ว่างก็ต้องมีเส้นขอบ */
      ws[a].s = st;
    };

    /* ── หัวเรื่องในกรอบหนา ── */
    for(let c=0;c<6;c++) put(0,c,{
      font:{name:XF,sz:18,bold:true}, alignment:mid, border:boxThick,
    });
    put(2,0,{ font:{name:XF,sz:14,bold:true} });
    put(3,0,{ font:{name:XF,sz:12} });

    /* ── หัวตาราง ── */
    for(let c=0;c<6;c++) put(R_HEAD,c,{
      font:{name:XF,sz:11,bold:true}, alignment:mid, border:boxAll,
      fill:{ patternType:'solid', fgColor:{rgb:'E8EDF5'} },
    });

    /* ── เนื้อตาราง — แถบสลับสีเหมือนฉบับพิมพ์ ── */
    for(let r=R_FIRST;r<=R_LAST;r++){
      const zebra = (r - R_FIRST) % 2 === 1
        ? { fill:{ patternType:'solid', fgColor:{rgb:'FAFBFC'} } } : {};
      for(let c=0;c<6;c++){
        const bold = KIND === 'LCB' ? (c===2||c===3) : (c===2);   /* เน้นเบอร์ตู้ (+ซีลถ้ามี) */
        put(r,c,{
          font:{name:XF,sz:c===2?12:11,bold}, alignment:mid, border:boxAll, ...zebra,
          ...(c===5 ? { numFmt:'#,##0' } : {}),
        });
      }
    }

    /* ── ท้ายกระดาษ ── */
    put(R_FOOT,0,{ font:{name:XF,sz:9,color:{rgb:'555555'}} });
    put(R_FOOT,5,{ font:{name:XF,sz:9,color:{rgb:'555555'}}, alignment:{horizontal:'right'} });

    ws['!cols'] = [{wch:7},{wch:22},{wch:17},{wch:14},{wch:19},{wch:14}];
    ws['!rows'] = [{hpt:30},{hpt:6},{hpt:22},{hpt:19},{hpt:6},{hpt:24}];
    for(let r=R_FIRST;r<=R_LAST;r++) ws['!rows'][r] = {hpt:22};
    ws['!merges'] = [
      {s:{r:0,c:0},e:{r:0,c:5}},
      {s:{r:2,c:0},e:{r:2,c:5}},
      {s:{r:3,c:0},e:{r:3,c:5}},
    ];
    /* พิมพ์ออกมาให้พอดี A4 แนวตั้ง หน้าเดียว และซ้ำหัวตารางทุกหน้า */
    ws['!pageSetup'] = { orientation:'portrait', paperSize:9, fitToWidth:1, fitToHeight:0 };
    ws['!printHeader'] = [R_HEAD+1, R_HEAD+1];

    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, 'เบอร์ตู้');
    XLSX.writeFile(wb, fileName('.xlsx'));
    say(`ออก Excel แล้ว ${ROWS.length} ตู้`);
  }catch(e){
    say('⚠️ ' + (e && e.message ? e.message : e));
  }
  btn.disabled = false; btn.textContent = '📊 Excel';
}

async function load(inv){
  // ลบลิงก์ PDF ของอินวอยซ์ก่อนหน้า กันกดแล้วได้ไฟล์ผิดใบ
  const old = document.getElementById('openpdf');
  if(old){ try{ URL.revokeObjectURL(old.href); }catch(_){} old.remove(); }
  document.getElementById('out').innerHTML = '<div class="mid">กำลังโหลด…</div>';
  try{
    const r = await fetch(`${API}/report?inv=${encodeURIComponent(inv)}`);
    const j = await r.json();
    if(!r.ok) throw new Error(j.error || ('HTTP ' + r.status));
    render(j.invoice, j.containers || [], j.kind, j.locked);
    history.replaceState(null, '', '?inv=' + encodeURIComponent(inv));
    return j.kind;                    /* ตัวเรียกใช้ดูว่าจะโชว์ dropdown ไหม */
  }catch(e){
    document.getElementById('out').innerHTML =
      `<div class="mid"><p class="err">${esc(e.message)}</p></div>`;
    return null;
  }
}

(async function(){
  document.getElementById('pdf').onclick = savePdf;
  document.getElementById('png').onclick = savePng;
  document.getElementById('xls').onclick = saveXlsx;
  const cur = new URLSearchParams(location.search).get('inv');
  const sel = document.getElementById('pick');

  /* ═══ แยกขาด LCB / ปาดัง — ห้ามเอาสองฝั่งมาปนกันใน dropdown เดียว ═══
     ระบุใบมา  → โหลดใบนั้นก่อน แล้วดูชนิด
                  LCB   = โชว์ dropdown ลิสต์แหลมฉบัง (ชุดเดียวกับที่บอทไลน์ใช้)
                  ปาดัง = ซ่อน dropdown โชว์เลขใบเฉยๆ (เข้ามาจาก DASHBOARD ทีละใบ)
     ไม่ระบุใบ → โหมดแหลมฉบังเหมือนเดิม (เปิดจากไลน์)                           */
  try{
    if(cur){
      const kind = await load(cur);          // load() คืนชนิดกลับมา
      if(kind === 'LCB'){
        const list = (await (await fetch(`${API}/report`)).json()).invoices || [];
        sel.innerHTML = list.map(i =>
          `<option value="${esc(i.invoice_no)}">${esc(i.invoice_no)}</option>`).join('');
        sel.value = cur;
        sel.onchange = () => load(sel.value);
      }else{
        sel.style.display = 'none';
        const tag = document.createElement('span');
        tag.style.cssText = 'font-size:13px;font-weight:800;color:#fff;padding:0 4px';
        tag.textContent = cur;
        sel.parentNode.insertBefore(tag, sel);
      }
      return;
    }

    const list = (await (await fetch(`${API}/report`)).json()).invoices || [];
    if(!list.length){
      sel.innerHTML = '<option>ยังไม่มีอินวอยซ์</option>';
      document.getElementById('out').innerHTML = '<div class="mid">ยังไม่มีอินวอยซ์ในระบบ</div>';
      return;
    }
    // ลิสต์เรียงเก่า→ใหม่ ตัวท้ายคือใบล่าสุด
    const first = list[list.length - 1].invoice_no;
    sel.innerHTML = list.map(i =>
      `<option value="${esc(i.invoice_no)}">${esc(i.invoice_no)}</option>`).join('');
    sel.value = first;
    sel.onchange = () => load(sel.value);
    load(first);
  }catch(e){
    document.getElementById('out').innerHTML =
      `<div class="mid"><p class="err">โหลดรายชื่ออินวอยซ์ไม่ได้: ${esc(e.message)}</p></div>`;
  }
})();
</script>
