<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>บันทึกตู้ LCB</title>
<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:-apple-system,"Segoe UI",Roboto,"Noto Sans Thai",sans-serif;
     background:#f1f5f9;color:#0f172a;font-size:15px;padding-bottom:96px}
.hd{background:linear-gradient(135deg,#1a3a6b,#0ea5e9);color:#fff;padding:18px 18px 22px}
.hd .ctr{font-size:26px;font-weight:800;letter-spacing:.5px;margin:2px 0 6px}
.hd .sub{font-size:12px;opacity:.9}
.badge{display:inline-block;font-size:11px;font-weight:700;padding:3px 9px;border-radius:99px;margin-top:8px}
.b-ok{background:#dcfce7;color:#166534}
.b-warn{background:#fef3c7;color:#92400e}
.wrap{padding:14px}
.card{background:#fff;border-radius:14px;padding:16px;margin-bottom:12px;
      box-shadow:0 1px 3px rgba(0,0,0,.07)}
.card h3{margin:0 0 12px;font-size:12px;font-weight:800;color:#64748b;
         text-transform:uppercase;letter-spacing:.7px}
label{display:block;font-size:12px;font-weight:700;color:#475569;margin:0 0 5px}
label .req{color:#e11d48}
input,select{width:100%;padding:11px 12px;font-size:16px;border:1.5px solid #cbd5e1;
             border-radius:9px;background:#fff;font-family:inherit;color:#0f172a}
input:focus,select:focus{outline:none;border-color:#0ea5e9;box-shadow:0 0 0 3px rgba(14,165,233,.15)}
.fld{margin-bottom:13px}
.fld:last-child{margin-bottom:0}
.hl input,.hl select{border-color:#0ea5e9;background:#f0f9ff}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:11px}
.ro{display:flex;justify-content:space-between;gap:12px;padding:7px 0;
    border-bottom:1px solid #f1f5f9;font-size:13px}
.ro:last-child{border-bottom:none}
.ro .k{color:#64748b;flex-shrink:0}
.ro .v{text-align:right;font-weight:600;word-break:break-word}
.note{background:#fef3c7;border-left:3px solid #f59e0b;padding:10px 12px;
      border-radius:8px;font-size:12.5px;color:#92400e;margin-bottom:12px;line-height:1.5}
.bar{position:fixed;left:0;right:0;bottom:0;padding:12px 14px calc(12px + env(safe-area-inset-bottom));
     background:#fff;border-top:1px solid #e2e8f0}
button{width:100%;padding:15px;font-size:16px;font-weight:800;color:#fff;border:none;
       border-radius:11px;background:linear-gradient(135deg,#059669,#10b981);font-family:inherit}
button:disabled{background:#94a3b8}
.mid{padding:70px 24px;text-align:center;color:#64748b;line-height:1.7}
.err{color:#b91c1c;font-weight:700}
</style>
</head>
<body>

<div id="app"><div class="mid">กำลังโหลด…</div></div>

<script>
const LIFF_ID = '2011063208-797yzibj';
const API = 'https://ywslgrusflfuxtrtvlfu.supabase.co/functions/v1/line-lcb';
let TOKEN = null;   // ต้องอ่านหลัง liff.init() เท่านั้น

const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const val = v => (v === null || v === undefined || v === '') ? '—' : v;

function fail(msg){
  $('app').innerHTML = `<div class="mid"><p class="err">${esc(msg)}</p>
    <p style="font-size:13px">ปิดหน้านี้แล้วลองส่งรูปใหม่ครับ</p></div>`;
}

// วันที่เข้าโรงงานมักเป็นวันถัดจากวันรับตู้
function nextDay(iso){
  if(!iso) return '';
  const d = new Date(iso + 'T00:00:00');
  if(isNaN(d)) return '';
  d.setDate(d.getDate() + 1);
  return d.toISOString().slice(0,10);
}

function render(d, invoices){
  const ok = d.ctr_no_valid === true && d.ctr_no_match === true;
  const opts = invoices.map(i => {
    const tail = i.expected ? ` — เหลือ ${i.remaining} ตู้` : '';
    return `<option value="${esc(i.invoice_no)}">${esc(i.invoice_no)}${tail}</option>`;
  }).join('');

  $('app').innerHTML = `
  <div class="hd">
    <div class="sub">บันทึกตู้ — แหลมฉบัง</div>
    <div class="ctr">${esc(val(d.container_no))}</div>
    <span class="badge ${ok?'b-ok':'b-warn'}">
      ${ok ? '✓ เบอร์ตู้ผ่านการตรวจสอบ' : '⚠ ตรวจสอบก่อนบันทึก'}
    </span>
  </div>

  <div class="wrap">
    ${d.review_note ? `<div class="note">⚠️ ${esc(d.review_note)}</div>` : ''}

    <div class="card">
      <h3>★ ต้องกรอก</h3>
      <div class="fld hl">
        <label>อินวอยซ์ <span class="req">*</span></label>
        <select id="invoice_no">
          <option value="">— เลือกอินวอยซ์ —</option>${opts}
        </select>
      </div>
      <div class="fld hl">
        <label>วันที่นำเข้าโรงงาน <span class="req">*</span></label>
        <input type="date" id="factory_date" value="${esc(nextDay(d.pickup_date))}">
      </div>
    </div>

    <div class="card">
      <h3>อ่านจากรูป — แก้ได้ถ้าไม่ตรง</h3>
      <div class="fld">
        <label>เบอร์ตู้</label>
        <input id="container_no" value="${esc(d.container_no ?? '')}" autocapitalize="characters">
      </div>
      <div class="fld">
        <label>เบอร์ซีล</label>
        <input id="seal_no" value="${esc(d.seal_no ?? '')}" autocapitalize="characters">
      </div>
      <div class="fld">
        <label>ทะเบียนรถ</label>
        <input id="truck_plate" value="${esc(d.truck_plate ?? '')}">
      </div>
      <div class="grid2">
        <div class="fld">
          <label>น้ำหนัก (kg)</label>
          <input type="number" id="weight" value="${esc(d.weight ?? '')}">
        </div>
        <div class="fld">
          <label>สายเรือ</label>
          <input id="shipping_line" value="${esc(d.shipping_line ?? '')}">
        </div>
      </div>
      <div class="fld">
        <label>วันที่รับตู้ (ตามใบ EIR)</label>
        <input type="date" id="pickup_date" value="${esc(d.pickup_date ?? '')}">
      </div>
    </div>

    <div class="card">
      <h3>ข้อมูลจากใบ EIR</h3>
      <div class="ro"><span class="k">ลูกค้า</span><span class="v">${esc(val(d.customer))}</span></div>
      <div class="ro"><span class="k">บริษัทรถ</span><span class="v">${esc(val(d.carrier))}</span></div>
      <div class="ro"><span class="k">ลานตู้</span><span class="v">${esc(val(d.depot))}</span></div>
      <div class="ro"><span class="k">REF.NO.</span><span class="v">${esc(val(d.eir_ref_no))}</span></div>
      <div class="ro"><span class="k">ชนิด / ขนาด</span><span class="v">${esc(val([d.ctr_type,d.ctr_size].filter(Boolean).join(' ')))}</span></div>
      <div class="ro"><span class="k">เต็ม / เปล่า</span><span class="v">${esc(val(d.load_status))}</span></div>
      <div class="ro"><span class="k">สภาพตู้</span><span class="v">${esc(val(d.condition))}</span></div>
      <div class="ro"><span class="k">เวลาออก</span><span class="v">${esc(val(d.time_out))}</span></div>
      <div class="ro"><span class="k">คนขับ</span><span class="v">${esc(val(d.driver_name))}</span></div>
    </div>

    <div class="card">
      <h3>ป้ายท้ายตู้</h3>
      <div class="ro"><span class="k">เจ้าของตู้</span><span class="v">${esc(val(d.ctr_owner))}</span></div>
      <div class="ro"><span class="k">รหัส ISO</span><span class="v">${esc(val(d.ctr_type_code))}</span></div>
      <div class="ro"><span class="k">MAX GROSS</span><span class="v">${d.max_gross_kg ? Number(d.max_gross_kg).toLocaleString()+' kg' : '—'}</span></div>
      <div class="ro"><span class="k">TARE</span><span class="v">${d.tare_kg ? Number(d.tare_kg).toLocaleString()+' kg' : '—'}</span></div>
      <div class="ro"><span class="k">NET</span><span class="v">${d.net_kg ? Number(d.net_kg).toLocaleString()+' kg' : '—'}</span></div>
      <div class="ro"><span class="k">ปริมาตร</span><span class="v">${esc(val(d.cu_cap_cbm))} m³</span></div>
    </div>
  </div>

  <div class="bar"><button id="save">บันทึกลงระบบ</button></div>`;

  $('save').onclick = save;
}

async function save(){
  const btn = $('save');
  const invoice_no = $('invoice_no').value;
  const factory_date = $('factory_date').value;

  if(!invoice_no){ alert('เลือกอินวอยซ์ก่อนครับ'); $('invoice_no').focus(); return; }
  if(!factory_date){ alert('ใส่วันที่นำเข้าโรงงานก่อนครับ'); $('factory_date').focus(); return; }

  btn.disabled = true; btn.textContent = 'กำลังบันทึก…';

  const fields = {
    invoice_no, factory_date,
    container_no:  $('container_no').value.trim().toUpperCase(),
    seal_no:       $('seal_no').value.trim().toUpperCase() || null,
    truck_plate:   $('truck_plate').value.trim() || null,
    weight:        $('weight').value ? Number($('weight').value) : null,
    shipping_line: $('shipping_line').value.trim() || null,
    pickup_date:   $('pickup_date').value || null,
  };

  try{
    const r = await fetch(API + '/submit', {
      method:'POST',
      headers:{'content-type':'application/json'},
      body: JSON.stringify({ token: TOKEN, fields }),
    });
    const j = await r.json();
    if(!r.ok) throw new Error(j.error || ('HTTP ' + r.status));

    btn.textContent = '✓ บันทึกแล้ว';
    setTimeout(() => { if(liff.isInClient()) liff.closeWindow(); }, 700);
  }catch(e){
    alert('บันทึกไม่สำเร็จ: ' + e.message);
    btn.disabled = false; btn.textContent = 'บันทึกลงระบบ';
  }
}

// LIFF ส่ง query มาได้ 2 ทาง — ตรงๆ หรือห่อใน liff.state
function readToken(){
  const q = new URLSearchParams(location.search);
  const direct = q.get('t');
  if(direct) return direct;

  const state = q.get('liff.state');
  if(state){
    const qs = state.includes('?') ? state.slice(state.indexOf('?') + 1) : state;
    const t = new URLSearchParams(qs).get('t');
    if(t) return t;
  }
  // เผื่อโผล่มาใน hash
  if(location.hash){
    const t = new URLSearchParams(location.hash.replace(/^#\/?/, '')).get('t');
    if(t) return t;
  }
  return null;
}

(async function(){
  // ⚠️ ต้อง init ก่อน — liff.init() เป็นตัวคลาย liff.state ให้กลายเป็น ?t=
  try{
    await liff.init({ liffId: LIFF_ID });
    if(!liff.isLoggedIn() && !liff.isInClient()){ liff.login(); return; }
  }catch(e){
    return fail('เปิด LIFF ไม่ได้: ' + e.message);
  }

  TOKEN = readToken();
  if(!TOKEN) return fail('ลิงก์ไม่ถูกต้อง (ไม่มี token)');

  try{
    const [dRes, iRes] = await Promise.all([
      fetch(`${API}/draft?t=${encodeURIComponent(TOKEN)}`),
      fetch(`${API}/invoices`),
    ]);
    const dJson = await dRes.json();
    if(!dRes.ok) return fail(dJson.error || 'โหลดข้อมูลไม่ได้');
    const iJson = await iRes.json();

    render(dJson.draft, iJson.invoices || []);
  }catch(e){
    fail('โหลดข้อมูลไม่ได้: ' + e.message);
  }
})();
</script>
</body>
</html>
