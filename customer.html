<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ติดตามออเดอร์ — ANTS</title>
<meta name="theme-color" content="#0f2a52">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
body{font-family:'Segoe UI',system-ui,sans-serif;background:#eef2f7;color:#1a202c;font-size:14px;}
/* ── LOGIN ── */
#loginScreen{position:fixed;inset:0;background:linear-gradient(135deg,#1e3a5f,#0f2a52);display:flex;align-items:center;justify-content:center;z-index:999;padding:16px;}
.login-card{background:#fff;border-radius:18px;padding:34px 28px;width:340px;max-width:94vw;box-shadow:0 20px 60px rgba(0,0,0,.35);text-align:center;}
.login-logo{font-size:38px;margin-bottom:8px;}
.login-title{font-size:18px;font-weight:900;color:#0f2a52;}
.login-sub{font-size:11.5px;color:#94a3b8;margin:4px 0 22px;}
.login-inp{width:100%;padding:12px 14px;border:1.5px solid #e2e8f0;border-radius:10px;font-size:15px;text-align:center;letter-spacing:.1em;outline:none;margin-bottom:10px;}
.login-inp:focus{border-color:#1e3a5f;}
.login-btn{width:100%;padding:12px;border:none;border-radius:10px;background:#1e3a5f;color:#fff;font-size:14px;font-weight:700;cursor:pointer;}
.login-btn:hover{background:#2563eb;}
.login-err{font-size:11.5px;color:#dc2626;margin-top:10px;min-height:16px;font-weight:600;}
/* ── APP ── */
#app{display:none;min-height:100dvh;flex-direction:column;}
.hdr{background:linear-gradient(100deg,#0a1628,#12284d);color:#fff;padding:14px 18px;padding-top:calc(14px + env(safe-area-inset-top,0px));display:flex;align-items:center;justify-content:space-between;gap:10px;}
.hdr .t{font-size:15px;font-weight:800;}
.hdr .s{font-size:10.5px;opacity:.6;margin-top:2px;}
.logout{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.25);color:#fff;border-radius:8px;padding:5px 12px;font-size:11px;cursor:pointer;font-weight:600;}
/* month chips */
.months{display:flex;gap:8px;padding:12px 16px 4px;overflow-x:auto;-webkit-overflow-scrolling:touch;}
.mchip{flex-shrink:0;padding:7px 16px;border-radius:20px;background:#fff;border:1.5px solid #e2e8f0;font-size:12.5px;font-weight:700;color:#64748b;cursor:pointer;white-space:nowrap;}
.mchip.on{background:#1e3a5f;color:#fff;border-color:#1e3a5f;}
/* invoice cards */
.list{padding:12px 16px 40px;display:flex;flex-direction:column;gap:10px;max-width:680px;margin:0 auto;width:100%;}
.card{background:#fff;border:1.5px solid #e8edf5;border-radius:14px;padding:14px 16px;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.05);}
.card:active{transform:scale(.99);}
.card .top{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;}
.card .inv{font-size:14.5px;font-weight:800;color:#0f2a52;}
.badge{font-size:10.5px;padding:3px 10px;border-radius:12px;font-weight:700;white-space:nowrap;}
.b-done{background:#dcfce7;color:#166534;}
.b-load{background:#fef3c7;color:#92400e;}
.b-wait{background:#f1f5f9;color:#64748b;}
.card .meta{font-size:11.5px;color:#64748b;margin-top:4px;}
/* timeline */
.tl{display:flex;align-items:flex-start;margin-top:12px;overflow-x:auto;padding-bottom:2px;}
.tl .seg{display:flex;flex-direction:column;align-items:center;min-width:52px;}
.tl .dot{width:20px;height:20px;border-radius:50%;background:#f3f4f6;border:2px solid #d1d5db;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.tl .seg.done .dot{background:#16a34a;border-color:#16a34a;}
.tl .seg.done .dot::after{content:'✓';color:#fff;font-size:10px;font-weight:800;}
.tl .lb{font-size:8.5px;text-align:center;margin-top:4px;color:#9ca3af;line-height:1.3;}
.tl .seg.done .lb{color:#15803d;font-weight:700;}
.tl .bar{flex:1;margin-top:9px;min-width:8px;height:2px;background:#e5e7eb;}
.tl .bar.done{background:#16a34a;}
/* detail */
.detail{display:none;margin-top:12px;border-top:1px dashed #e2e8f0;padding-top:12px;}
.card.open .detail{display:block;}
.vsl{display:flex;align-items:center;gap:10px;background:#eff6ff;border:1px solid #bfdbfe;border-radius:10px;padding:9px 12px;margin-bottom:10px;}
.vsl .n{font-size:12.5px;font-weight:700;color:#1e40af;}
.vsl .d{font-size:10.5px;color:#64748b;margin-top:2px;}
table{width:100%;border-collapse:collapse;font-size:11.5px;}
th{background:#0f2a52;color:#fff;padding:6px 9px;text-align:left;font-size:10px;font-weight:700;}
td{padding:6px 9px;border-bottom:1px solid #f1f5f9;}
tr:last-child td{border-bottom:none;}
.ctrno{font-family:'Courier New',monospace;font-weight:700;}
.empty{text-align:center;color:#94a3b8;padding:50px 20px;font-size:13px;}
.loading{text-align:center;color:#64748b;padding:60px 20px;font-size:13px;}
</style>
</head>
<body>

<!-- LOGIN -->
<div id="loginScreen">
  <div class="login-card">
    <div class="login-logo">📦</div>
    <div class="login-title">ติดตามออเดอร์</div>
    <div class="login-sub">เข้าสู่ระบบเพื่อดูสถานะออเดอร์ของท่าน</div>
    <form onsubmit="doLogin();return false;" autocomplete="on">
      <input class="login-inp" id="userInp" type="text" placeholder="ชื่อผู้ใช้ (ID)" autocomplete="username" onkeydown="if(event.key==='Enter'){event.preventDefault();document.getElementById('codeInp').focus();}">
      <input class="login-inp" id="codeInp" type="password" placeholder="รหัสผ่าน" autocomplete="current-password">
      <button class="login-btn" type="submit">เข้าสู่ระบบ</button>
    </form>
    <div class="login-err" id="loginErr"></div>
  </div>
</div>

<!-- APP -->
<div id="app">
  <div class="hdr">
    <div>
      <div class="t" id="custName">—</div>
      <div class="s" id="custSub">สถานะออเดอร์ของท่าน</div>
    </div>
    <div style="display:flex;gap:6px;align-items:center;">
      <button class="logout" id="acctBtn" onclick="toggleAcct()" style="background:#b45309;border-color:#b45309;">🏦 บัญชีโรงงาน</button>
      <button class="logout" onclick="doLogout()">ออกจากระบบ</button>
    </div>
  </div>
  <div class="months" id="monthBar"></div>
  <div class="months" id="filterBar" style="padding-top:2px;"></div>
  <div class="list" id="invList"><div class="loading">กำลังโหลด...</div></div>
  <div class="list" id="acctView" style="display:none;"></div>
</div>

<script>
/* ⚠️ ใช้ ANON KEY เท่านั้น — ห้ามใส่ service_role key ในไฟล์นี้เด็ดขาด */
const SB_URL='https://ywslgrusflfuxtrtvlfu.supabase.co';
const SB_ANON_KEY='sb_publishable_nrjNNyA08-GCRphIQuzvvg_YpGxiYeY';

const h=s=>String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const THM=['','ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];
let ACC=null,INV=[],CTR={},VSL={},CUR_M='',PRICES=[],FILTER='all',BILLS=[],PAYS=[],ACCT=false;

async function sb(path){
  /* ดึงครบทุกแถว (PostgREST จำกัด 1000 แถว/ครั้ง — ต้องแบ่งหน้า) */
  const all=[];const PAGE=1000;let off=0;
  while(true){
    const r=await fetch(`${SB_URL}/rest/v1/${path}&limit=${PAGE}&offset=${off}`,{headers:{apikey:SB_ANON_KEY,Authorization:`Bearer ${SB_ANON_KEY}`}});
    if(!r.ok)throw new Error('โหลดข้อมูลไม่สำเร็จ ('+r.status+')');
    const batch=await r.json();
    all.push(...batch);
    if(batch.length<PAGE)break;
    off+=PAGE;
  }
  return all;
}
async function doLogin(){
  const user=document.getElementById('userInp').value.trim();
  const code=document.getElementById('codeInp').value.trim();
  const err=document.getElementById('loginErr');
  if(!user||!code){err.textContent='กรุณาใส่ชื่อผู้ใช้และรหัสผ่าน';return;}
  err.textContent='';
  try{
    const r=await fetch(`${SB_URL}/rest/v1/rpc/customer_login`,{
      method:'POST',
      headers:{apikey:SB_ANON_KEY,Authorization:`Bearer ${SB_ANON_KEY}`,'Content-Type':'application/json'},
      body:JSON.stringify({p_user:user,p_code:code})
    });
    const rows=await r.json();
    if(!Array.isArray(rows)||!rows.length){err.textContent='ชื่อผู้ใช้หรือรหัสผ่านไม่ถูกต้อง';return;}
    ACC=rows[0];ACC.user=user;ACC.code=code;
    sessionStorage.setItem('cust_acc',JSON.stringify(ACC));
    enter();
  }catch(e){err.textContent='เชื่อมต่อไม่ได้ กรุณาลองใหม่';}
}
function doLogout(){sessionStorage.removeItem('cust_acc');location.reload();}

function pfxOf(inv){const m=String(inv||'').toUpperCase().match(/^[A-Z]+/);return m?m[0]:'';}
function mine(inv){const p=pfxOf(inv);return ACC.prefixes.some(x=>p===String(x).toUpperCase());}

async function enter(){
  document.getElementById('loginScreen').style.display='none';
  document.getElementById('app').style.display='flex';
  document.getElementById('custName').textContent='📦 '+ACC.customer_name;
  try{
    const [inv,ctr,vsl]=await Promise.all([
      sb('customer_invoices?order=invoice_no'),
      sb('customer_containers?order=invoice_no'),
      sb('customer_vessels?order=invoice_no'),
    ]);
    INV=inv.filter(r=>mine(r.invoice_no));
    ctr.filter(r=>mine(r.invoice_no)).forEach(r=>{(CTR[r.invoice_no]=CTR[r.invoice_no]||[]).push(r);});
    vsl.filter(r=>mine(r.invoice_no)).forEach(r=>{VSL[r.invoice_no]=r;});
    const rpcH={apikey:SB_ANON_KEY,Authorization:`Bearer ${SB_ANON_KEY}`,'Content-Type':'application/json'};
    const rpcBody=JSON.stringify({p_user:ACC.user||'',p_code:ACC.code||''});
    try{
      const pr=await fetch(`${SB_URL}/rest/v1/rpc/customer_prices`,{method:'POST',headers:rpcH,body:rpcBody});
      if(pr.ok)PRICES=await pr.json();
    }catch(e){}
    try{
      const [b,p]=await Promise.all([
        fetch(`${SB_URL}/rest/v1/rpc/customer_billing`,{method:'POST',headers:rpcH,body:rpcBody}),
        fetch(`${SB_URL}/rest/v1/rpc/customer_payments`,{method:'POST',headers:rpcH,body:rpcBody}),
      ]);
      if(b.ok)BILLS=await b.json();
      if(p.ok)PAYS=await p.json();
    }catch(e){}
    renderMonths();
  }catch(e){
    document.getElementById('invList').innerHTML=`<div class="empty">⚠️ ${h(e.message)}</div>`;
  }
}
function mkey(r){return (r.year||0)*100+(r.month||0);}
function renderMonths(){
  const ms=[...new Set(INV.filter(r=>r.month>0).map(mkey))].sort((a,b)=>b-a);
  const bar=document.getElementById('monthBar');
  if(!ms.length){bar.innerHTML='';document.getElementById('invList').innerHTML='<div class="empty">ยังไม่มีออเดอร์</div>';return;}
  CUR_M=CUR_M&&ms.includes(CUR_M)?CUR_M:ms[0];
  bar.innerHTML=ms.map(m=>`<div class="mchip${m===CUR_M?' on':''}" onclick="selM(${m})">${THM[m%100]} ${String(Math.floor(m/100)).slice(-2)}</div>`).join('');
  document.getElementById('filterBar').innerHTML=[['all','ทั้งหมด'],['pending','⏳ คงค้าง'],['done','✅ เสร็จแล้ว']]
    .map(([v,l])=>`<div class="mchip${FILTER===v?' on':''}" onclick="selF('${v}')">${l}</div>`).join('');
  renderList();
}
function selM(m){CUR_M=m;renderMonths();}
function selF(v){FILTER=v;renderMonths();}
const nrm=s=>String(s||'').toUpperCase().replace(/\s+/g,'');
function findPrice(inv){
  if(!PRICES.length)return null;
  const nk=nrm(inv);
  let row=PRICES.find(p=>nrm(p.invoice_no)===nk);
  if(!row)row=PRICES.find(p=>{const k=nrm(p.invoice_no);if(k.length<3||!nk.startsWith(k))return false;const nx=nk[k.length];return nx===undefined||nx==='/'||nx==='-';});
  if(!row){const f=nk.replace(/[-_\/]/g,'');row=PRICES.find(p=>nrm(p.invoice_no).replace(/[-_\/]/g,'')===f);}
  return row||null;
}
const fmB=n=>(+n||0).toLocaleString('th-TH');
const fm2=n=>(+n||0).toLocaleString('th-TH',{minimumFractionDigits:2,maximumFractionDigits:2});
function toggleAcct(){
  ACCT=!ACCT;
  document.getElementById('monthBar').style.display=ACCT?'none':'flex';
  document.getElementById('filterBar').style.display=ACCT?'none':'flex';
  document.getElementById('invList').style.display=ACCT?'none':'flex';
  document.getElementById('acctView').style.display=ACCT?'flex':'none';
  document.getElementById('acctBtn').textContent=ACCT?'📦 สถานะออเดอร์':'🏦 บัญชีโรงงาน';
  if(ACCT)renderAcct();
}
function renderAcct(){
  const el=document.getElementById('acctView');
  const paidSet=new Set(PAYS.map(p=>nrm(p.invoice_no)));
  const debt=BILLS.filter(b=>!paidSet.has(nrm(b.invoice_no)))
    .sort((a,b)=>String(a.bill_date||'').localeCompare(String(b.bill_date||'')));
  const debtTotal=debt.reduce((s,b)=>s+(+b.amount||0),0);
  const pays=[...PAYS].sort((a,b)=>String(b.paid_date||'').localeCompare(String(a.paid_date||''))).slice(0,10);
  let out='';
  /* summary */
  out+=`<div style="display:flex;gap:10px;flex-wrap:wrap;">`;
  out+=`<div style="flex:1;min-width:140px;background:#fff;border:1.5px solid #fde68a;border-radius:14px;padding:14px 16px;"><div style="font-size:11px;color:#92400e;font-weight:700;">ยอดค้างชำระ</div><div style="font-size:22px;font-weight:900;color:#b45309;margin-top:2px;">${fm2(debtTotal)}</div><div style="font-size:10px;color:#94a3b8;">บาท · ${debt.length} อินวอยซ์</div></div>`;
  const lastPay=pays[0];
  out+=`<div style="flex:1;min-width:140px;background:#fff;border:1.5px solid #bbf7d0;border-radius:14px;padding:14px 16px;"><div style="font-size:11px;color:#166534;font-weight:700;">ชำระล่าสุด</div><div style="font-size:22px;font-weight:900;color:#16a34a;margin-top:2px;">${lastPay?fm2(lastPay.amount):'-'}</div><div style="font-size:10px;color:#94a3b8;">${lastPay?'บาท · '+fmtDate(lastPay.paid_date):'ยังไม่มีรายการ'}</div></div>`;
  out+=`</div>`;
  /* debt table */
  out+=`<div class="card" style="cursor:default;"><div style="font-size:13px;font-weight:800;color:#b45309;margin-bottom:8px;">📋 รายการค้างชำระ</div>`;
  if(!debt.length)out+=`<div style="font-size:12.5px;color:#16a34a;font-weight:700;text-align:center;padding:14px;">✅ ไม่มียอดค้างชำระ</div>`;
  else{
    out+='<table><thead><tr><th>วันที่วางบิล</th><th>อินวอยซ์</th><th style="text-align:center;">ตู้</th><th style="text-align:right;">ยอด (บาท)</th></tr></thead><tbody>';
    debt.forEach(b=>{out+=`<tr><td>${b.bill_date?fmtDate(b.bill_date):'-'}</td><td style="font-weight:700;">${h(b.invoice_no)}</td><td style="text-align:center;">${b.container_count||'-'}</td><td style="text-align:right;font-family:monospace;font-weight:700;color:#b45309;">${fm2(b.amount)}</td></tr>`;});
    out+=`<tr><td colspan="3" style="font-weight:800;background:#fef3c7;">ยอดรวมค้างชำระ</td><td style="text-align:right;font-family:monospace;font-weight:900;color:#b45309;background:#fef3c7;">${fm2(debtTotal)}</td></tr>`;
    out+='</tbody></table>';
  }
  out+=`</div>`;
  /* PENDING — มีตู้แล้วแต่ยังไม่วางบิลจริง (ประมาณการ) */
  const billedSet=new Set(BILLS.map(b=>nrm(b.invoice_no)));
  const pend=[];
  INV.forEach(r=>{
    if(!r.month)return;
    const nk=nrm(r.invoice_no);
    if(billedSet.has(nk)||paidSet.has(nk))return;
    const ctrs=CTR[r.invoice_no]||[];
    const n=ctrs.length||r.container_count||0;
    if(!n)return;
    const pe=findPrice(r.invoice_no);
    let est=0,noPrice=!pe;
    if(pe){
      if(pe.price_type==='simple')est=(parseFloat(pe.price)||0)*n;
      else if(pe.price_type==='tiered'){
        let trs=pe.tiers;if(typeof trs==='string'){try{trs=JSON.parse(trs)}catch(e){trs=[]}}
        (trs||[]).forEach(t=>{const from=+t.from||0,to=+t.to||0;const c=Math.max(0,Math.min(n,to)-from+1);if(c>0)est+=c*(+t.price||0);});
      }else if(pe.price_type==='factory'){
        let fac=pe.factories;if(typeof fac==='string'){try{fac=JSON.parse(fac)}catch(e){fac={}}}fac=fac||{};
        ctrs.forEach(c=>{est+=(+fac[c.factory]||0);});
      }
      if(!est)noPrice=true;
    }
    pend.push({inv:r.invoice_no,n,est,noPrice});
  });
  if(pend.length){
    const pendTotal=pend.reduce((s,x)=>s+x.est,0);
    out+=`<div class="card" style="cursor:default;background:#fffbeb;border-color:#fde68a;"><div style="font-size:13px;font-weight:800;color:#92400e;margin-bottom:8px;">⏳ PENDING — ประมาณการ (ยังไม่วางบิล)</div>`;
    out+='<table><thead><tr><th style="background:#92400e;">อินวอยซ์</th><th style="background:#92400e;text-align:center;">ตู้</th><th style="background:#92400e;text-align:right;">ยอดประมาณการ (บาท)</th></tr></thead><tbody>';
    pend.forEach(x=>{
      const amt=x.noPrice?'<span style="font-size:10px;background:#fee2e2;color:#dc2626;border-radius:4px;padding:1px 6px;font-weight:700;">ไม่มีราคา</span>':fm2(x.est);
      out+=`<tr><td style="font-weight:700;">${h(x.inv)}</td><td style="text-align:center;">${x.n}</td><td style="text-align:right;font-family:monospace;font-weight:700;color:#92400e;">${amt}</td></tr>`;
    });
    if(pendTotal>0)out+=`<tr><td colspan="2" style="font-weight:800;background:#fef3c7;">ยอดประมาณการรวม</td><td style="text-align:right;font-family:monospace;font-weight:900;color:#92400e;background:#fef3c7;">${fm2(pendTotal)}</td></tr>`;
    out+='</tbody></table>';
    out+=`<div style="font-size:10px;color:#92400e;opacity:.75;margin-top:6px;">⚠️ ยอด PENDING เป็นประมาณการจากจำนวนตู้ × ราคา — ยังไม่ใช่ยอดวางบิลจริง</div>`;
    out+=`</div>`;
  }
  /* recent payments */
  out+=`<div class="card" style="cursor:default;"><div style="font-size:13px;font-weight:800;color:#166534;margin-bottom:8px;">💰 รายการชำระล่าสุด</div>`;
  if(!pays.length)out+=`<div style="font-size:12.5px;color:#94a3b8;text-align:center;padding:14px;">ยังไม่มีรายการชำระ</div>`;
  else{
    out+='<table><thead><tr><th>วันที่ชำระ</th><th>อินวอยซ์</th><th style="text-align:right;">ยอด (บาท)</th></tr></thead><tbody>';
    pays.forEach(p=>{out+=`<tr><td>${p.paid_date?fmtDate(p.paid_date):'-'}</td><td style="font-weight:700;">${h(p.invoice_no)}</td><td style="text-align:right;font-family:monospace;font-weight:700;color:#16a34a;">${fm2(p.amount)}</td></tr>`;});
    out+='</tbody></table>';
  }
  out+=`</div>`;
  el.innerHTML=out;
}
function parseDMY(s){
  let m=String(s||'').match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);
  if(m)return new Date(+m[1],+m[2]-1,+m[3]);
  m=String(s||'').match(/(\d{1,2})\/(\d{1,2})\/(\d{4})/);
  if(m)return new Date(+m[3],+m[2]-1,+m[1]);
  return null;
}
function fmtDate(s){const d=parseDMY(s);return d?`${d.getDate()}/${d.getMonth()+1}/${d.getFullYear()}`:String(s||'-');}
function renderList(){
  const list=INV.filter(r=>mkey(r)===CUR_M).sort((a,b)=>String(a.invoice_no).localeCompare(String(b.invoice_no)));
  const el=document.getElementById('invList');
  if(!list.length){el.innerHTML='<div class="empty">ไม่มีออเดอร์ในเดือนนี้</div>';return;}
  const today=new Date();today.setHours(0,0,0,0);
  el.innerHTML=list.map((r,idx)=>{
    const ctrs=CTR[r.invoice_no]||[];
    const exp=r.container_count||0,act=ctrs.length;
    const v=VSL[r.invoice_no];
    const doc=r.doc_status==='ปล่อยเอกสารแล้ว';
    const sd=v?parseDMY(v.sail_date):null;
    const dep=!!(sd&&sd<today);
    let st=[true,act>0,exp>0&&act>=exp,doc,doc&&!!v,dep];
    for(let i=1;i<6;i++)st[i]=st[i]&&st[i-1];
    const lbs=['เปิดออเดอร์','กำลังขึ้นตู้','ขึ้นตู้ครบ','ปล่อยเอกสาร','จัดลงเรือแล้ว','เรือออกแล้ว'];
    const stage=st.lastIndexOf(true);
    if(FILTER==='pending'&&stage>=5)return '';
    if(FILTER==='done'&&stage<5)return '';
    /* ── ราคา (เฉพาะ prefix ของลูกค้าเอง ผ่าน RPC) ── */
    const pe=findPrice(r.invoice_no);
    let cardPrice='',priceDet='';
    if(pe){
      if(pe.price_type==='simple'){
        const pp=parseFloat(pe.price)||0;const n=act||exp;
        if(pp>0&&n>0){cardPrice=` · 💰 ประมาณการวางบิล <b style="color:#166534;">${fmB(pp*n)} บาท</b>`;
          priceDet=`<div style="background:#f0fdf4;border:1px solid #bbf7d0;border-radius:10px;padding:8px 12px;margin-bottom:10px;font-size:12px;color:#166534;">💰 ค่าขนส่ง ${fmB(pp)} บาท/ตู้ × ${n} ตู้ = <b>${fmB(pp*n)} บาท</b></div>`;}
      }else if(pe.price_type==='tiered'){
        let trs=pe.tiers;if(typeof trs==='string'){try{trs=JSON.parse(trs)}catch(e){trs=[]}}trs=trs||[];
        let tot=0,rows='';
        trs.forEach(t=>{const c=t.to-t.from+1;const s2=c*(+t.price||0);tot+=s2;rows+=`<tr><td>ตู้ที่ ${t.from}–${t.to}</td><td>${fmB(t.price)}</td><td style="text-align:right;">${fmB(s2)}</td></tr>`;});
        if(tot>0){cardPrice=` · 💰 ประมาณการวางบิล <b style="color:#166534;">${fmB(tot)} บาท</b>`;
          priceDet=`<table style="margin-bottom:10px;"><thead><tr><th>ช่วงตู้</th><th>ราคา/ตู้</th><th style="text-align:right;">รวม (บาท)</th></tr></thead><tbody>${rows}<tr><td colspan="2"><b>ยอดรวม</b></td><td style="text-align:right;"><b>${fmB(tot)}</b></td></tr></tbody></table>`;}
      }else if(pe.price_type==='factory'){
        let fac=pe.factories;if(typeof fac==='string'){try{fac=JSON.parse(fac)}catch(e){fac={}}}fac=fac||{};
        const cnt={};ctrs.forEach(c=>{const f=c.factory||'-';cnt[f]=(cnt[f]||0)+1;});
        let tot=0,rows='';
        Object.keys(cnt).forEach(f=>{const pp=+fac[f]||0;const s2=pp*cnt[f];tot+=s2;rows+=`<tr><td>${h(f)}</td><td>${cnt[f]}</td><td>${pp?fmB(pp):'-'}</td><td style="text-align:right;">${s2?fmB(s2):'-'}</td></tr>`;});
        if(tot>0){cardPrice=` · 💰 ประมาณการวางบิล <b style="color:#166534;">${fmB(tot)} บาท</b>`;
          priceDet=`<table style="margin-bottom:10px;"><thead><tr><th>โรงงาน</th><th>ตู้</th><th>ราคา/ตู้</th><th style="text-align:right;">รวม (บาท)</th></tr></thead><tbody>${rows}<tr><td colspan="3"><b>ยอดรวม</b></td><td style="text-align:right;"><b>${fmB(tot)}</b></td></tr></tbody></table>`;}
      }
    }
    const badge=stage>=5?'<span class="badge b-done">🚢 เรือออกแล้ว</span>'
      :stage>=4?'<span class="badge b-done">จัดลงเรือแล้ว</span>'
      :stage>=3?'<span class="badge b-done">ปล่อยเอกสารแล้ว</span>'
      :stage>=1?`<span class="badge b-load">กำลังขึ้นตู้ ${act}/${exp}</span>`
      :'<span class="badge b-wait">เปิดออเดอร์</span>';
    let tl='<div class="tl">';
    st.forEach((ok,i)=>{
      tl+=`<div class="seg${ok?' done':''}"><div class="dot"></div><div class="lb">${lbs[i]}</div></div>`;
      if(i<5)tl+=`<div class="bar${ok?' done':''}"></div>`;
    });
    tl+='</div>';
    let det='<div class="detail">';
    if(v)det+=`<div class="vsl"><span style="font-size:18px;">🚢</span><div><div class="n">${h(v.vessel_name)}</div><div class="d">กำหนดเรือออก: <b>${fmtDate(v.sail_date)}</b> · BKG: <b>${h(v.booking_no)}</b> · ปลายทาง: <b>${h(v.destination)}</b></div></div></div>`;
    det+=priceDet;
    if(ctrs.length){
      det+='<table><thead><tr><th>ทะเบียนรถ</th><th>เบอร์ตู้</th><th>เข้าโรงงาน</th><th>วันที่</th></tr></thead><tbody>';
      ctrs.forEach(c=>{det+=`<tr><td>${h(c.truck_plate||'-')}</td><td class="ctrno">${h(c.container_no)}</td><td>${h(c.factory||'-')}</td><td>${c.factory_date?fmtDate(c.factory_date):'-'}</td></tr>`;});
      det+='</tbody></table>';
    }else det+='<div style="font-size:12px;color:#94a3b8;text-align:center;padding:8px;">ยังไม่มีตู้เข้าโรงงาน</div>';
    det+='</div>';
    return `<div class="card" id="c${idx}" onclick="this.classList.toggle('open')">
      <div class="top"><span class="inv">${h(r.invoice_no)}</span>${badge}</div>
      <div class="meta">${exp?act+'/'+exp+' ตู้':''}${r.destination?' · '+h(r.destination):''}${v?` · 🚢 <b style="color:#1e40af;">${h(v.vessel_name)}</b> · ออก ${fmtDate(v.sail_date)}`:''}${cardPrice}</div>
      ${tl}${det}</div>`;
  }).join('')||`<div class="empty">${FILTER==='pending'?'ไม่มีออเดอร์คงค้างในเดือนนี้ 🎉':'ไม่มีออเดอร์ที่เสร็จแล้วในเดือนนี้'}</div>`;
}
/* auto-login จาก session */
(()=>{try{const a=JSON.parse(sessionStorage.getItem('cust_acc')||'null');if(a){ACC=a;enter();}}catch(e){}})();
</script>
</body>
